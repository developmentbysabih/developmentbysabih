<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient perfectly calibrated for GitHub Dark Mode #0D1117 -->
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D14"/>
      <stop offset="0.6" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0B131F"/>
    </linearGradient>

    <!-- Animated Cyber Gradient Border -->
    <linearGradient id="cyberGlow" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="0.35" stop-color="#38BDF8"/>
      <stop offset="0.7" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#10B981"/>
      <animate attributeName="x1" values="-300;900;-300" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="600;1800;600" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <radialGradient id="emeraldSpot" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 80) scale(260 180)">
      <stop stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanSpot" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 150) scale(320 220)">
      <stop stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="300" rx="20" fill="url(#canvasBg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#emeraldSpot)"/>
  <rect width="1200" height="300" rx="20" fill="url(#cyanSpot)"/>

  <!-- Architectural Grid Lines -->
  <g opacity="0.06" stroke="#38BDF8">
    <path d="M0 60H1200"/><path d="M0 120H1200"/><path d="M0 180H1200"/><path d="M0 240H1200"/>
    <path d="M120 0V300"/><path d="M240 0V300"/><path d="M360 0V300"/><path d="M480 0V300"/>
    <path d="M600 0V300"/><path d="M720 0V300"/><path d="M840 0V300"/><path d="M960 0V300"/><path d="M1080 0V300"/>
  </g>

  <!-- Left Accent Vertical Pillar -->
  <rect x="52" y="44" width="5" height="195" rx="2.5" fill="url(#cyberGlow)"/>

  <!-- Live Status Beacon -->
  <g transform="translate(76, 44)">
    <rect width="250" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#10B981">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="13" r="8" stroke="#10B981" stroke-width="1.2" opacity="0.4">
      <animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="17.5" fill="#7EE787" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">AVAILABLE FOR OPPORTUNITIES</text>
  </g>

  <!-- Typography Content -->
  <text x="76" y="112" fill="#F0F6FC" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="1.5">SABIH ULLAH</text>
  <text x="78" y="148" fill="#38BDF8" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">FULL-STACK SYSTEMS ENGINEER  •  WEB ARCHITECT</text>
  <text x="78" y="184" fill="#8B949E" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="15" font-weight="500">TypeScript  •  Next.js  •  React  •  Python  •  Systems Automation</text>
  <text x="78" y="214" fill="#64748B" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="13.5" font-weight="400">Engineering resilient web architectures &amp; autonomous software pipelines.</text>

  <!-- Quick Tech Badges on Header -->
  <g transform="translate(78, 238)">
    <rect x="0" y="0" width="76" height="22" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="38" y="15" fill="#58A6FF" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Next.js</text>

    <rect x="84" y="0" width="94" height="22" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="131" y="15" fill="#38BDF8" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="186" y="0" width="76" height="22" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="224" y="15" fill="#34D399" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Python</text>

    <rect x="270" y="0" width="102" height="22" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="321" y="15" fill="#F472B6" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Automation</text>
  </g>

  <!-- Right Visual: Interactive Code Terminal Card -->
  <g transform="translate(680, 36)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="470" height="228" rx="14" fill="#0D1117" stroke="url(#cyberGlow)" stroke-width="1.8"/>

    <!-- Terminal Header Bar -->
    <path d="M0 14C0 6.268 6.268 0 14 0H456C463.732 0 470 6.268 470 14V34H0V14Z" fill="#161B22"/>
    <path d="M0 34H470" stroke="#30363D" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="20" cy="17" r="5" fill="#F87171"/>
    <circle cx="36" cy="17" r="5" fill="#FBBF24"/>
    <circle cx="52" cy="17" r="5" fill="#34D399"/>

    <!-- Tab Label -->
    <rect x="74" y="7" width="150" height="20" rx="4" fill="#21262D"/>
    <text x="90" y="21" fill="#C9D1D9" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">engineer.config.ts</text>

    <!-- Code Content -->
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500">
      <text x="22" y="62">
        <tspan fill="#F472B6">const</tspan>
        <tspan fill="#79C0FF"> SabihUllah</tspan>
        <tspan fill="#C9D1D9"> = {</tspan>
      </text>

      <text x="42" y="86">
        <tspan fill="#8B949E">discipline:</tspan>
        <tspan fill="#A5D6FF"> "Full-Stack &amp; Systems"</tspan>
        <tspan fill="#C9D1D9">,</tspan>
      </text>

      <text x="42" y="110">
        <tspan fill="#8B949E">coreStack:</tspan>
        <tspan fill="#C9D1D9"> [</tspan>
        <tspan fill="#7EE787">"TypeScript"</tspan>
        <tspan fill="#C9D1D9">, </tspan>
        <tspan fill="#7EE787">"Next.js"</tspan>
        <tspan fill="#C9D1D9">, </tspan>
        <tspan fill="#7EE787">"Python"</tspan>
        <tspan fill="#C9D1D9">],</tspan>
      </text>

      <text x="42" y="134">
        <tspan fill="#8B949E">mindset:</tspan>
        <tspan fill="#A5D6FF"> "High Performance • Clean Architecture"</tspan>
        <tspan fill="#C9D1D9">,</tspan>
      </text>

      <text x="42" y="158">
        <tspan fill="#8B949E">status:</tspan>
        <tspan fill="#7EE787"> "Deploying robust solutions"</tspan>
      </text>

      <text x="22" y="182">
        <tspan fill="#C9D1D9">};</tspan>
      </text>

      <text x="22" y="206">
        <tspan fill="#F472B6">await</tspan>
        <tspan fill="#79C0FF"> SabihUllah</tspan>
        <tspan fill="#C9D1D9">.</tspan>
        <tspan fill="#D2A8FF">deliverImpact</tspan>
        <tspan fill="#C9D1D9">();</tspan>
      </text>

      <!-- Blinking Cursor -->
      <rect x="238" y="195" width="7.5" height="14" fill="#38BDF8">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Glowing Outer Border -->
  <rect x="1" y="1" width="1198" height="298" rx="19" stroke="url(#cyberGlow)" stroke-opacity="0.45" stroke-width="1.8"/>
</svg>
